<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DeliveryAdmin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- "?v=2": browsers keep a tab icon for a very long time; a new address makes them fetch the new one. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <!-- Runtime config. Must load before the Angular bundle: the container
       rewrites this file at startup so one image serves every environment. -->
  <script src="env.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
