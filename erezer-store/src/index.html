<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ErezerStore</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Runtime config. Must load before the Angular bundle: the container
       rewrites this file at startup so one image serves every environment. -->
  <script src="env.js"></script>

  <!-- Open at the top of the page. Browsers otherwise put a reopened tab back
       where it was last left, which lands below the hero and looks like the
       hero is missing. The app restores its own positions for Back/Forward. -->
  <script>if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }</script>

  <!-- Design-studio fonts. These must be real webfonts, not CSS-only names:
       the custom-design canvas rasterises text with the font engine, so a
       family that is not actually loaded silently renders as a fallback.
       Only weights each family genuinely ships are requested - asking for a
       weight a font does not have makes Google return an error instead of CSS. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Loaded without holding up the first paint: the studio asks for each family
       through document.fonts.load() before it draws with it. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Caveat:wght@400;700&family=Lobster&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;700&family=Righteous&family=Hind+Siliguri:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Caveat:wght@400;700&family=Lobster&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;700&family=Righteous&family=Hind+Siliguri:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&display=swap" /></noscript>
  <!-- First paint: the shop's own dark band with the wordmark, so the top of the
       page is never a blank sheet while the app downloads. Angular clears it. -->
  <style>
    .app-boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0a0a0a; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 1.125rem; font-weight: 600; letter-spacing: 0.22em;
    }
    .app-boot span { animation: appBootPulse 1.4s ease-in-out infinite; }
    @keyframes appBootPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .app-boot span { animation: none; } }
  </style>
</head>
<body>
  <app-root>
    <div class="app-boot" aria-hidden="true"><span>EREZER</span></div>
  </app-root>
</body>
</html>
