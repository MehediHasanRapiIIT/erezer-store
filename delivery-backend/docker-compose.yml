# ============================================================================
# delivery-backend - STANDALONE stack
#
# The API plus every datastore it needs, and nothing else. Use this when you
# are working on the backend alone and do not want to build the two Angular
# apps (which is most of the build time in the full stack).
#
#   docker compose up -d --build
#   docker compose logs -f backend
#   docker compose down            stop, keep data
#   docker compose down -v         stop and WIPE data
#
#   API + docs   http://localhost:8080/swagger-ui/index.html
#   health       http://localhost:8080/actuator/health
#   Keycloak     http://localhost:9090   (admin / admin)
#   MinIO        http://localhost:9001   (minioadmin / minioadmin)
#   Mailpit      http://localhost:8025
#
# This runs under its own compose project name (`erezer-backend`), so it has
# separate volumes from the full stack at the repo root and the two cannot
# clobber each other's data. Run one or the other, not both - they compete for
# the same host ports.
# ============================================================================

name: erezer-backend

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery_app_v1}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delivery_app_v1}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [erezer]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [erezer]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [erezer]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # Buckets default to private; anonymous read is what lets an <img src>
    # from the browser load an uploaded image instead of getting a 403.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      for b in product-images banner-images custom-design-images return-photos; do
        mc mb --ignore-existing local/$$b &&
        mc anonymous set download local/$$b;
      done &&
      echo 'MinIO buckets ready'
      "
    restart: "no"
    networks: [erezer]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # Without this Mailpit keeps mail in memory and a restart discards the
      # verification / order emails you were about to click.
      MP_DATABASE: /data/mailpit.db
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    networks: [erezer]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--http-port=9090", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Public address - becomes the `iss` claim the backend validates.
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:-http://localhost:9090}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-9090}:9090"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Health is on the management port 9000 in Keycloak 25+, and the image
      # ships no curl/wget - so probe the socket with bash's built-in /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [erezer]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPO_OWNER:-erezer}/delivery-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker

      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-delivery_app_v1}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}

      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      DDL_AUTO: ${DDL_AUTO:-validate}
      SHOW_SQL: ${SHOW_SQL:-false}

      # Validate the public issuer, fetch signing keys over the internal network.
      KEYCLOAK_ISSUER_URI: ${PUBLIC_KEYCLOAK_URL:-http://localhost:9090}/realms/${KEYCLOAK_REALM:-delivery-admin}
      KEYCLOAK_JWK_SET_URI: http://keycloak:9090/realms/${KEYCLOAK_REALM:-delivery-admin}/protocol/openid-connect/certs

      # Upload through the internal endpoint, hand the browser a public URL.
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: ${PUBLIC_MINIO_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"

      EREZER_STORE_URL: ${PUBLIC_STORE_URL:-http://localhost:4200}
      EREZER_ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:4300}

      EREZER_JWT_SECRET: ${EREZER_JWT_SECRET:-standalone-backend-dev-secret-min-32-characters-long}

      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
      SENTRY_ENV: ${SENTRY_ENV:-local}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    networks: [erezer]

networks:
  erezer:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
