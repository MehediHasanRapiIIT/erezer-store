# ============================================================================
# prod profile — activated by SPRING_PROFILES_ACTIVE=prod (set in Dockerfile).
# ============================================================================
# Everything here is env-var driven. The base application.properties hardcodes
# localhost for Postgres/Keycloak/MinIO, which is correct for a dev machine but
# resolves to the *container itself* in prod. Datasource values are deliberately
# left without defaults so a missing env var fails fast at startup with
# "Could not resolve placeholder" instead of a confusing connection refused.

server.port=${SERVER_PORT:8080}

# --- Database ---------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# --- JPA / Hibernate --------------------------------------------------------
# `validate` now that V1 is a real baseline: Flyway owns the schema outright and
# Hibernate only checks that it matches the entity model, failing fast on drift.
# Never set this to `update` in prod - it would let an unreviewed entity change
# alter the live schema behind Flyway's back.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Flyway -----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# --- Keycloak (admin resource server) ---------------------------------------
# issuer-uri  = the PUBLIC address the browser used, and therefore the `iss`
#               claim inside every token. Behind a reverse proxy this is the
#               https:// hostname, which this container often cannot reach.
# jwk-set-uri = how this container fetches the signing keys, over the internal
#               network. Setting both makes Spring Boot skip OIDC discovery, so
#               a public issuer never has to be resolvable from inside the pod.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs}

# --- MinIO / object storage -------------------------------------------------
minio.url=${MINIO_URL}
# Browser-facing MinIO base URL - concatenated into stored image URLs, so it
# must be resolvable from a BROWSER. In a proxied deployment minio.url is an
# internal address (http://minio:9000) and this is the public one; leaving them
# equal is what makes uploaded images fail to render.
minio.public-url=${MINIO_PUBLIC_URL:${MINIO_URL}}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET:product-images}
minio.banner-bucket-name=${MINIO_BANNER_BUCKET:banner-images}
minio.custom-design-bucket-name=${MINIO_CUSTOM_DESIGN_BUCKET:custom-design-images}

# --- Redis ------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# --- Customer JWT -----------------------------------------------------------
# No default: the base file's placeholder secret must never reach prod.
app.jwt.secret=${EREZER_JWT_SECRET}

# --- Thymeleaf --------------------------------------------------------------
spring.thymeleaf.cache=true

# --- Logging ----------------------------------------------------------------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.hibernate.SQL=WARN

# --- Actuator ---------------------------------------------------------------
# Health only, without details - this is what the container HEALTHCHECK and any
# orchestrator readiness probe call. Everything else stays unexposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
