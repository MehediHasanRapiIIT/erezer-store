<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/parts :: page(~{::#content}, 'order')}">
<body>
<div id="content">
  <h1 style="margin:0 0 6px;font-size:21px;line-height:1.3;">Your order is confirmed</h1>
  <p style="margin:0 0 18px;color:#78716c;font-size:14px;">Order <strong style="color:#1c1917;" th:text="${orderNumber}">EZ-000000</strong></p>

  <p style="margin:0 0 16px;">Hi <span th:text="${customerName}">there</span>,</p>
  <p style="margin:0 0 16px;">Thank you for shopping with Erezer. We have accepted your order and are getting it ready. We will email you again when it is on its way.</p>
  <p th:if="${note}" style="margin:0 0 16px;padding:12px 16px;background:#fafaf9;border-left:3px solid #0c0a09;color:#44403c;" th:text="${note}">A note from our team.</p>

  <div th:replace="~{email/_items :: items}"></div>

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 22px;font-size:14px;">
    <tr>
      <td style="padding:0 12px 0 0;vertical-align:top;width:50%;">
        <div style="color:#78716c;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;">Delivering to</div>
        <div style="color:#1c1917;" th:text="${deliveryAddress}">Address</div>
      </td>
      <td style="vertical-align:top;width:50%;">
        <div style="color:#78716c;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;">Payment</div>
        <div style="color:#1c1917;" th:text="${paymentLabel}">Cash on delivery</div>
      </td>
    </tr>
  </table>

  <p style="margin:0;">
    <a th:href="${orderUrl}" href="#" style="display:inline-block;background:#0c0a09;color:#ffffff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;">View your order</a>
  </p>
</div>
</body>
</html>
