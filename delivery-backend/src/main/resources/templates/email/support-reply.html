<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/parts :: page(~{::#content}, 'support')}">
<body>
<div id="content">
  <p style="margin:0 0 16px;font-size:16px;">Hi <span th:text="${customerName}">there</span>,</p>

    <!-- The reply, paragraph by paragraph; line breaks inside a paragraph are kept. -->
    <p th:each="paragraph : ${replyParagraphs}" th:text="${paragraph}"
       style="margin:0 0 16px;font-size:16px;line-height:1.6;white-space:pre-line;">Our reply.</p>

    <p style="margin:24px 0 0;font-size:16px;line-height:1.6;">Thank you,<br/>The Erezer team</p>

    <!-- What the customer wrote, so the reply makes sense on its own. -->
    <div style="margin:32px 0 0;padding:16px 20px;background:#fafaf9;border:1px solid #e7e5e4;border-radius:8px;">
      <div style="color:#78716c;font-size:12px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">
        Your message<span th:if="${originalSubject}"> &middot; <span th:text="${originalSubject}">Subject</span></span>
      </div>
      <p th:each="paragraph : ${originalParagraphs}" th:text="${paragraph}"
         style="margin:0 0 10px;color:#44403c;font-size:14px;line-height:1.6;white-space:pre-line;">What you wrote.</p>
    </div>
</div>
</body>
</html>
