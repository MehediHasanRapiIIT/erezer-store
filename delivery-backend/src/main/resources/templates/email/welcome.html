<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/parts :: page(~{::#content}, 'account')}">
<body>
<div id="content">
  <h1 style="margin:0 0 16px;font-size:22px;">Welcome, <span th:text="${firstName}">friend</span>!</h1>
    <p style="margin:0 0 16px;line-height:1.6;">
      Thanks for joining Erezer. We're glad to have you. Discover our latest drops, manage your orders, and curate your wardrobe — all in one place.
    </p>
    <p style="margin:0 0 24px;line-height:1.6;">
      Start exploring:
    </p>
    <p style="margin:24px 0;">
      <a th:href="${storeUrl}" style="display:inline-block;background:#0c0a09;color:#fafaf9;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;">Shop the latest</a>
    </p>
</div>
</body>
</html>
