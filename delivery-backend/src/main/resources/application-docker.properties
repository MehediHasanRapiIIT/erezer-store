# ============================================================================
# docker profile - activated by SPRING_PROFILES_ACTIVE=docker from compose.
# ============================================================================
# This is the containerised LOCAL stack. It differs from `local` (kept as-is
# for running the app from an IDE) and from `prod` (fully env-driven, no
# defaults, schema owned by Flyway with ddl-auto=validate).
#
# The rule that governs this whole file: a value is written either for THIS
# JVM or for a BROWSER, and inside Docker those are different addresses.
#   container-to-container -> service name  (postgres, redis, minio, keycloak)
#   browser-facing         -> published URL (localhost:9000, localhost:9090)
# Getting that backwards is what breaks image loading and admin login.

server.port=8080

# --- Database ---------------------------------------------------------------
# `postgres` is the compose service name, resolvable on the erezer network.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:delivery_app_v1}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}

# --- JPA / Flyway -----------------------------------------------------------
# Flyway owns the schema: V1 is a full baseline, so a brand-new volume is built
# by the migrations alone. ddl-auto=validate then proves the entity model still
# matches - the same contract prod runs under, which is the point of testing
# here first. Set DDL_AUTO=update to loosen it while iterating on entities.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# --- Keycloak ---------------------------------------------------------------
# issuer-uri  = what the browser used, and therefore the `iss` claim in the
#               token. Must match KC_HOSTNAME on the keycloak service.
# jwk-set-uri = how THIS container fetches the signing keys.
# Both set => Spring Boot skips discovery and no hosts-file entry is needed.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/delivery-admin}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:9090/realms/delivery-admin/protocol/openid-connect/certs}

# --- MinIO ------------------------------------------------------------------
# url        = internal endpoint this JVM uploads through.
# public-url = what gets baked into stored image URLs for the browser.
minio.url=${MINIO_URL:http://minio:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

# --- Redis ------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Mail (Mailpit catcher: SMTP :1025, read at http://localhost:8025) ------
# Mailpit takes mail with no auth and no TLS, so both are off here.
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:no-reply@erezer.local}
app.mail.from-name=${MAIL_FROM_NAME:Erezer (docker)}
app.custom-design.admin-email=${CUSTOM_DESIGN_ADMIN_EMAIL:custom@erezer.local}

# --- Frontend URLs ----------------------------------------------------------
# Pasted into emails as clickable links, so these are browser addresses.
app.frontend.store-url=${EREZER_STORE_URL:http://localhost:4200}
app.frontend.admin-url=${EREZER_ADMIN_URL:http://localhost:4300}

# --- Customer JWT -----------------------------------------------------------
app.jwt.secret=${EREZER_JWT_SECRET:docker-local-secret-not-for-production-min-32-chars}

# --- Uploads ----------------------------------------------------------------
# Custom-design submissions carry several flattened preview PNGs.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:60MB}

# --- Misc -------------------------------------------------------------------
spring.thymeleaf.cache=false
logging.level.root=${LOG_LEVEL_ROOT:INFO}
